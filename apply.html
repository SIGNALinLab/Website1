<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | SIGNAL Lab</title><meta name="description" content="SIGNAL Lab research-participation application."><meta name="theme-color" content="#0B1736"><meta property="og:title" content="Apply | SIGNAL Lab"><meta property="og:description" content="SIGNAL Lab research-participation application."><meta property="og:type" content="website"><meta property="og:image" content="assets/brand/logo-horizontal-2400.png"><meta name="twitter:card" content="summary_large_image"><link id="canonical-link" rel="canonical" href=""><link rel="icon" href="assets/brand/favicon.ico"><link rel="stylesheet" href="assets/css/styles.css"></head><body data-page="admissions"><div id="site-header"></div><main id="main"><section class="page-hero"><div class="container"><div class="eyebrow">Participation request</div><h1>Apply to SIGNAL Lab</h1><p>The form can submit to a configured Google Apps Script endpoint; until configured, it fails gracefully and directs applicants to email.</p></div></section><section class="section"><div class="container"><form class="card" data-signal-form="application"><div class="form-grid"><label class="field"><span>Name</span><input name="name" required autocomplete="name"></label><label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label><label class="field"><span>Current program / discipline</span><input name="program" required></label><label class="field"><span>Participation type</span><select name="participationType" required><option value="">Choose</option><option>Undergraduate research</option><option>Senior design</option><option>Graduate research</option><option>Other research collaboration</option></select></label><label class="field full"><span>Research areas of interest</span><textarea name="interests" required></textarea></label><label class="field full"><span>Relevant technical skills and experience</span><textarea name="skills" required></textarea></label><label class="field"><span>Expected weekly availability</span><input name="availability"></label><label class="field"><span>Expected research timeline</span><input name="timeline"></label><label class="field full"><span>Portfolio / publications / code link (optional)</span><input name="links" type="url"></label><label class="field full consent"><input type="checkbox" name="consent" value="yes" required><span>I consent to SIGNAL Lab receiving and reviewing this information for research-participation purposes. I understand this is not an offer of admission, funding, employment, supervision, or project placement.</span></label></div><button class="btn btn-dark" type="submit">Submit application</button><div class="form-status" aria-live="polite"></div></form></div></section></main><div id="site-footer"></div><script src="assets/js/main.js" defer></script><script src="assets/js/forms.js" defer></script></body></html>
